<!--
  Icône sur fond plein, pour iOS et le manifeste (zone sûre des icônes masquables).
  Rendu, depuis web/ :
  inkscape medias/icone-pleine.svg -w 180 -h 180 -o public/apple-touch-icon.png
  inkscape medias/icone-pleine.svg -w 512 -h 512 -o public/icone-masquable.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f3eee3"/>
  <g transform="translate(32 32) scale(0.62) translate(-32 -32)">
    <g transform="rotate(-6 32 32)">
      <rect x="12" y="12" width="44" height="44" rx="12" fill="#0f1f19"/>
      <rect x="7" y="7" width="44" height="44" rx="12" fill="#ff6b4a" stroke="#0f1f19" stroke-width="2.5"/>
      <text x="29" y="40" text-anchor="middle" fill="#0f1f19" font-family="Iowan Old Style" font-size="25" font-weight="700" letter-spacing="-0.5">ÉL</text>
    </g>
  </g>
</svg>
